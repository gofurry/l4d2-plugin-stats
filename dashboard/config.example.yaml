# Production serves both the embedded React UI and API from this address.
# Use 0.0.0.0:18848 only when intentionally exposing the service directly.
server:
  listen: "127.0.0.1:18848"

# Relative paths are resolved from the directory containing config.yaml.
dashboard_database:
  path: "./dashboard.db"

# Supported drivers: sqlite, mysql, pgsql.
# SQLite is always opened read-only. MySQL and PostgreSQL credentials should
# use a database account that has SELECT permission only.
stats_database:
  driver: "sqlite"
  dsn: "./l4d2_player_stats.sq3"

logging:
  file: "./logs/l4d2-stats.log"

# The status page is available only to an authenticated administrator.
monitor:
  enabled: true

# Optional advanced fields keep safe defaults and may be omitted:
# server.read_timeout/write_timeout/idle_timeout
# stats_database.query_timeout/max_open_conns/max_idle_conns/conn_max_lifetime
# logging.level/format/max_size_mb/max_backups/max_age_days/compress/also_console
# monitor.refresh/disk_paths
